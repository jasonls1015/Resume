name: Build and deploy resumes

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  pages: write

env:
  DOCKER_VERSION: 2026.07.8925

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - id: twr
            instance: Writerside/twr
            web_artifact: webHelpTWR2-all.zip
            pdf_artifact: pdfSourceTWR.pdf
            outdir: technical-writer
            has_pdf: true
          - id: der
            instance: Writerside/der
            web_artifact: webHelpDER2-all.zip
            pdf_artifact: pdfSourceDER.pdf
            outdir: documentation-engineer
            has_pdf: true
          - id: ctr
            instance: Writerside/ctr
            web_artifact: webHelpCTR2-all.zip
            pdf_artifact: pdfSourceCTR.pdf
            outdir: custom-tailored
            has_pdf: true
          - id: smp
            instance: Writerside/smp
            web_artifact: webHelpSMP2-all.zip
            outdir: docs
            has_pdf: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build WebHelp - ${{ matrix.instance }}
        uses: JetBrains/writerside-github-action@v4
        with:
          instance: ${{ matrix.instance }}
          artifact: ${{ matrix.web_artifact }}
          docker-version: ${{ env.DOCKER_VERSION }}

      - name: Unzip WebHelp into site subdirectory
        run: |
          mkdir -p site/${{ matrix.outdir }}
          unzip -q artifacts/${{ matrix.web_artifact }} -d site/${{ matrix.outdir }}

      - name: Clear artifacts before PDF build
        if: matrix.has_pdf
        run: rm -rf artifacts/*

      - name: Build PDF - ${{ matrix.instance }}
        if: matrix.has_pdf
        uses: JetBrains/writerside-github-action@v4
        with:
          instance: ${{ matrix.instance }}
          docker-version: ${{ env.DOCKER_VERSION }}
          pdf: 'PDF.xml'
          artifact: ${{ matrix.pdf_artifact }}

      - name: Stage PDF for download
        if: matrix.has_pdf
        run: |
          mkdir -p site/downloads
          cp artifacts/${{ matrix.pdf_artifact }} site/downloads/${{ matrix.id }}-resume.pdf

      - name: Upload site fragment
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.id }}
          path: site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all site fragments
        uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: fragments

      - name: Merge fragments into final site
        run: |
          mkdir -p final-site
          for frag in fragments/*/; do
            cp -r "$frag"/* final-site/
          done
          cp docs/index.html final-site/index.html

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: final-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4