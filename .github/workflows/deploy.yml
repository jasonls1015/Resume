name: Build and deploy resumes

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write
  pages: write

env:
  DOCKER_VERSION: 232.10165.1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - id: twr
            instance: Writerside/twr
            web_artifact: webHelpTWR2-all.zip
            pdf_artifact: pdfSourceTWR.pdf
            outdir: technical-writer
          - id: cer
            instance: Writerside/cer
            web_artifact: webHelpCER2-all.zip
            pdf_artifact: pdfSourceCER.pdf
            outdir: content-engineer
          - id: kmr
            instance: Writerside/kmr
            web_artifact: webHelpKMR2-all.zip
            pdf_artifact: pdfSourceKMR.pdf
            outdir: knowledge-manager

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build WebHelp - ${{ matrix.instance }}
        uses: JetBrains/writerside-github-action@v4
        with:
          instance: ${{ matrix.instance }}
          artifact: ${{ matrix.web_artifact }}
          docker-version: ${{ env.DOCKER_VERSION }}

      - name: Unzip WebHelp into site subdirectory
        run: |
          mkdir -p site/${{ matrix.outdir }}
          unzip -q artifacts/${{ matrix.web_artifact }} -d site/${{ matrix.outdir }}

      - name: Clear artifacts before PDF build
        run: rm -rf artifacts/*

      - name: Build PDF - ${{ matrix.instance }}
        uses: JetBrains/writerside-github-action@v4
        with:
          instance: ${{ matrix.instance }}
          docker-version: ${{ env.DOCKER_VERSION }}
          pdf: 'Writerside/cfg/PDF.xml'

      - name: Stage PDF for download
        run: |
          mkdir -p site/downloads
          cp artifacts/${{ matrix.pdf_artifact }} site/downloads/${{ matrix.id }}-resume.pdf

      - name: Upload site fragment
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.id }}
          path: site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all site fragments
        uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: fragments

      - name: Merge fragments into final site
        run: |
          mkdir -p final-site
          for frag in fragments/*/; do
            cp -r "$frag"/* final-site/
          done
          cp docs/index.html final-site/index.html

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: final-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4